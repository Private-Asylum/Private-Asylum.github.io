[workspace]
resolver = "3"
# The pvas-web-shared submodule is its own workspace, with its own lints, lockfile and CI.
exclude = ["pvas-web-shared"]
members = [
    # privateasylum.com itself: its pages and their content.
    "Crates/site",
    # The site's binary: renders every page and hands them to pvas-web-site's build/serve.
    "Crates/render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Private Asylum LLC"]
repository = "https://github.com/Private-Asylum/Private-Asylum.github.io"
homepage = "https://privateasylum.com/"
publish = false

[workspace.dependencies]
pvas-site = { path = "Crates/site" }

# Everything Private Asylum's sites share: components, the Yeti build, writing and serving a site.
# Developed here, in the pvas-web-shared submodule; the submodule's commit is the pin, so a
# change there reaches this site when the submodule pointer moves. Other sites pin it by git rev.
pvas-web-shared = { path = "pvas-web-shared/Crates/pvas-web-shared" }

# Dioxus as a renderer only, for this site's own pages. Must stay on the same line as
# pvas-web-shared's, or the two would build different `Element` types.
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals"] }

# Full strict. Every group denied, so a lint is an error locally and in CI alike. Groups sit at
# priority -1 so an individual lint below can override its group.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# The one cargo lint that cannot hold: Dioxus's own dependency tree carries two majors of syn,
# which no crate here can change. Revisit when Dioxus moves to a single syn.
multiple_crate_versions = "allow"
# Contradicts rustc's unreachable_pub, which is kept: inside a private module one demands
# pub(crate) and the other forbids it (clippy documents the conflict; it is why this lint is
# nursery). unreachable_pub is the stronger check: it catches pub items nothing exports.
redundant_pub_crate = "allow"

# From the restriction group, which is never enabled wholesale (its lints contradict each other,
# and clippy flags doing so as blanket_clippy_restriction_lints): the ones that hold here.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
